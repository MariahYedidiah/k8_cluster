apiVersion: apps/v1
kind: Deployment
metadata:
  name: runtime-collector
  namespace: kube-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: runtime-collector
  template:
    metadata:
      labels:
        app: runtime-collector
    spec:
      serviceAccountName: cache-writer
      containers:
      - name: collector
        image: localhost:5000/runtime-collector:v3
        imagePullPolicy: Always
        env:
        - name: PROM_URL
          value: "http://prometheus.istio-system.svc.cluster.local:9090"
        - name: INTERVAL
          value: "15"

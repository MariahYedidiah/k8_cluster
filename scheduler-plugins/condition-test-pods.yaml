apiVersion: v1
kind: Pod
metadata:
  name: cpu-heavy
  namespace: sched-tests
  labels:
    app: condition-test
spec:
  schedulerName: clustercriticality-scheduler
  containers:
  - name: pause
    image: registry.k8s.io/pause:3.10
    resources:
      requests:
        cpu: "900m"
        memory: "64Mi"
---
apiVersion: v1
kind: Pod
metadata:
  name: memory-heavy
  namespace: sched-tests
  labels:
    app: condition-test
spec:
  schedulerName: clustercriticality-scheduler
  containers:
  - name: pause
    image: registry.k8s.io/pause:3.10
    resources:
      requests:
        cpu: "100m"
        memory: "900Mi"
---
apiVersion: v1
kind: Pod
metadata:
  name: qos-besteffort
  namespace: sched-tests
  labels:
    app: condition-test
spec:
  schedulerName: clustercriticality-scheduler
  containers:
  - name: pause
    image: registry.k8s.io/pause:3.10
---
apiVersion: v1
kind: Pod
metadata:
  name: qos-guaranteed
  namespace: sched-tests
  labels:
    app: condition-test
spec:
  schedulerName: clustercriticality-scheduler
  containers:
  - name: pause
    image: registry.k8s.io/pause:3.10
    resources:
      requests:
        cpu: "200m"
        memory: "128Mi"
      limits:
        cpu: "200m"
        memory: "128Mi"
---
apiVersion: v1
kind: Pod
metadata:
  name: affinity-test
  namespace: sched-tests
  labels:
    app: affinity-test
spec:
  schedulerName: clustercriticality-scheduler
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
          - key: affinity-target
            operator: In
            values:
            - "yes"
  containers:
  - name: pause
    image: registry.k8s.io/pause:3.10
---
apiVersion: v1
kind: Pod
metadata:
  name: taint-tolerant
  namespace: sched-tests
  labels:
    app: taint-test
spec:
  schedulerName: clustercriticality-scheduler
  tolerations:
  - key: "special"
    operator: "Equal"
    value: "avoid"
    effect: "PreferNoSchedule"
  containers:
  - name: pause
    image: registry.k8s.io/pause:3.10
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: topology-test
  namespace: sched-tests
spec:
  replicas: 6
  selector:
    matchLabels:
      app: topology-test
  template:
    metadata:
      labels:
        app: topology-test
    spec:
      schedulerName: clustercriticality-scheduler
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: topology-test
      containers:
      - name: pause
        image: registry.k8s.io/pause:3.10

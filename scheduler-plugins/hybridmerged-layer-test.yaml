apiVersion: apps/v1
kind: Deployment
metadata:
  name: hybridmerged-layer-test
  namespace: layer-eval
spec:
  replicas: 6
  selector:
    matchLabels:
      app: hybridmerged-layer-test
  template:
    metadata:
      labels:
        app: hybridmerged-layer-test
    spec:
      schedulerName: hybridmerged-scheduler
      containers:
      - name: cached-image
        image: localhost:5000/netmarks-collector:v1
        imagePullPolicy: IfNotPresent
        command: ["sleep", "3600"]

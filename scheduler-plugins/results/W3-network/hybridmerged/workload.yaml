apiVersion: apps/v1
kind: Deployment
metadata:
  name: w3-ratings
  namespace: bookinfo-net
  labels:
    test: w3-network
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ratings
      version: v1
      test: w3-network
  template:
    metadata:
      labels:
        app: ratings
        version: v1
        test: w3-network
    spec:
      schedulerName: hybridmerged-scheduler
      containers:
      - name: pause
        image: registry.k8s.io/pause:3.10
---

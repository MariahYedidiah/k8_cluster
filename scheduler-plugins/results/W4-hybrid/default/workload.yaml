---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hm-topology
  namespace: hybrid-eval
spec:
  replicas: 6
  selector:
    matchLabels:
      app: hm-topology
  template:
    metadata:
      labels:
        app: hm-topology
    spec:
      schedulerName: default-scheduler
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: hm-topology
      containers:
      - name: pause
        image: registry.k8s.io/pause:3.10

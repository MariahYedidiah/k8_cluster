apiVersion: apps/v1
kind: Deployment
metadata:
  name: hm-layer
  namespace: hybrid-eval
spec:
  replicas: 4
  selector:
    matchLabels:
      app: hm-layer
  template:
    metadata:
      labels:
        app: hm-layer
    spec:
      schedulerName: default-scheduler
      containers:
      - name: cached
        image: localhost:5000/netmarks-collector:v1
        imagePullPolicy: IfNotPresent
        command: ["sleep", "3600"]
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hm-ratings
  namespace: hybrid-eval
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ratings
      version: v1
  template:
    metadata:
      labels:
        app: ratings
        version: v1
    spec:
      schedulerName: default-scheduler
      containers:
      - name: pause
        image: registry.k8s.io/pause:3.10
        resources:
          requests:
            cpu: "100m"
            memory: "64Mi"
---

apiVersion: v1
kind: ConfigMap
metadata:
  name: hybrid-scheduler5-config
  namespace: kube-system
data:
  config.yaml: |
    apiVersion: kubescheduler.config.k8s.io/v1
    kind: KubeSchedulerConfiguration
    leaderElection:
      leaderElect: false
    profiles:
    - schedulerName: hybrid-scheduler5
      plugins:
        score:
          enabled:
          - name: HybridScore
            weight: 100
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hybrid-scheduler5
  namespace: kube-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hybrid-scheduler5
  template:
    metadata:
      labels:
        app: hybrid-scheduler5
    spec:
      serviceAccountName: hybrid-scheduler5
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
      - key: "node-role.kubernetes.io/control-plane"
        operator: "Exists"
        effect: "NoSchedule"
      containers:
      - name: kube-scheduler
        image: localhost:5000/scheduler-plugins/kube-scheduler:version9
        imagePullPolicy: IfNotPresent
        command:
        - /bin/kube-scheduler
        args:
        - --config=/etc/kubernetes/config/config.yaml
        volumeMounts:
        - name: config-volume
          mountPath: /etc/kubernetes/config
      volumes:
      - name: config-volume
        configMap:
          name: hybrid-scheduler5-config

apiVersion: v1
kind: ConfigMap
metadata:
  name: hybrid-scheduler5-config
  namespace: kube-system
data:
  config.yaml: |
    apiVersion: kubescheduler.config.k8s.io/v1
    kind: KubeSchedulerConfiguration
    leaderElection:
      leaderElect: false
    profiles:
    - schedulerName: hybrid-scheduler5
      plugins:
        preScore:
          enabled:

apiVersion: v1
kind: ConfigMap
metadata:
  name: criticality-scheduler-config
  namespace: kube-system
data:
  config.yaml: |
    apiVersion: kubescheduler.config.k8s.io/v1
    kind: KubeSchedulerConfiguration
    leaderElection:
      leaderElect: false
    profiles:
    - schedulerName: criticality-scheduler
      plugins:
        preScore:
          enabled:
          - name: CriticalityScore
        score:
          enabled:
          - name: CriticalityScore
            weight: 100
---

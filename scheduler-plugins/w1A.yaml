apiVersion: v1
kind: Pod
metadata:
  name: affinity-test
  namespace: sched-tests
spec:
  schedulerName: hybridmerged-scheduler
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: kubernetes.io/hostname
            operator: In
            values:
            - playground-cluster-worker3
  containers:
  - name: pause
    image: registry.k8s.io/pause:3.10

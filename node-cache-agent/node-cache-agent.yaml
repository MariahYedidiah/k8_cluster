apiVersion: v1
kind: ServiceAccount
metadata:
  name: node-cache-agent
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: node-cache-agent
  namespace: kube-system
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: node-cache-agent
  namespace: kube-system
subjects:
- kind: ServiceAccount
  name: node-cache-agent
  namespace: kube-system
roleRef:
  kind: Role
  name: node-cache-agent
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-cache-agent
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app: node-cache-agent
  template:
    metadata:
      labels:
        app: node-cache-agent
    spec:
      serviceAccountName: node-cache-agent
      containers:
      - name: node-cache-agent
        image: localhost:5000/node-cache-agent:v1
        imagePullPolicy: IfNotPresent
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        volumeMounts:
        - name: containerd-sock
          mountPath: /run/containerd/containerd.sock
      volumes:
      - name: containerd-sock
        hostPath:
          path: /run/containerd/containerd.sock
          type: Socket
